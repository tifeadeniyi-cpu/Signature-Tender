name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: st_owner
          POSTGRES_PASSWORD: st_owner
          POSTGRES_DB: signature_tender_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U st_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL_OWNER: postgres://st_owner:st_owner@localhost:5432/signature_tender_test
      TEST_DATABASE_URL: postgres://st_app:st_app@localhost:5432/signature_tender_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create app database role
        run: PGPASSWORD=st_owner psql -h localhost -U st_owner -d signature_tender_test -c "CREATE ROLE st_app LOGIN PASSWORD 'st_app';"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build web app
        run: pnpm build
        env:
          DATABASE_URL: postgres://st_app:st_app@localhost:5432/signature_tender_test
          BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
          BETTER_AUTH_URL: http://localhost:3100
          APP_ENV: test
      - run: pnpm --filter @st/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run check:shared
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npx jest --ci
